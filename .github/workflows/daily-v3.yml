
name: Shorts AI Studio 3.2

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "YouTube channel"
        required: true
        default: "animals"
        type: choice
        options:
          - animals
          - philosophy
          - nature
          - healing
          - beauty
          - food

      mode:
        description: "Plan / Preview / Render"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - preview
          - render

      approved_run_id:
        description: "Approved plan or preview run ID"
        required: false
        default: ""
        type: string

      custom_script:
        description: "Optional custom story or script"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: shorts-studio-v32
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      OPENAI_MODEL: gpt-4.1-mini

      CHANNEL: ${{ inputs.channel }}
      MODE: ${{ inputs.mode }}
      CUSTOM_SCRIPT: ${{ inputs.custom_script }}

      APPROVED_RUN_ID: ${{ inputs.approved_run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install "openai>=1.75,<3" requests pillow

      - name: Install FFmpeg and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f

      - name: Check API keys
        run: |
          python - <<'PY'
          import os

          mode = os.environ["MODE"]

          keys = ["OPENAI_API_KEY"]

          if mode == "plan":
              keys.append("YOUTUBE_API_KEY")

          if mode in ["preview", "render"]:
              keys.append("RUNWAYML_API_SECRET")

          for key in keys:
              if not os.getenv(key):
                  raise RuntimeError(f"Missing secret: {key}")
              print(f"{key}: configured")
          PY

      - name: Download approved plan or preview
        if: inputs.mode != 'plan'
        run: |
          if ! [[ "$APPROVED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Enter a valid approved run ID."
            exit 1
          fi

          mkdir -p output

          gh run download "$APPROVED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name shorts-v32 \
            --dir output

          test -f output/metadata.json

          if [ "$MODE" = "render" ]; then
            test -f output/preview.jpg
          fi

      - name: Run Shorts AI Studio 3.2
        run: |
          python studio_v32.py

      - name: Verify output
        run: |
          test -s output/metadata.json

          if [ "$MODE" = "plan" ]; then
            test -s output/plan.md
            test -s output/trends.json
          fi

          if [ "$MODE" = "preview" ]; then
            test -s output/preview.jpg
          fi

          if [ "$MODE" = "render" ]; then
            test -s output/shorts_final.mp4

            ffprobe -v error \
              -show_entries format=duration,size \
              -of json \
              output/shorts_final.mp4
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: shorts-v32
          path: |
            output/metadata.json
            output/trends.json
            output/reviews.json
            output/plan.md
            output/preview.jpg
            output/scene_*.jpg
            output/shorts_final.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Finish summary
        run: |
          echo "## Shorts AI Studio 3.2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: $MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Channel: $CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the shorts-v32 artifact below." >> "$GITHUB_STEP_SUMMARY"

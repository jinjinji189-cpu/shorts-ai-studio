name: Daily Shorts AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      
      - name: Search YouTube
        id: youtube_search
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python engine.py

      
      - name: Save results
        if: steps.youtube_search.outcome == 'success'
        run: |
          git config user.name "Shorts AI Bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update daily videos"
          git push


      - name: Prepare test video
        run: |
          mkdir -p input output
          ffmpeg -y -f lavfi \
            -i color=c=black:s=1080x1920:r=30 \
            -t 5 -c:v libx264 \
            -pix_fmt yuv420p input/sample.mp4
          printf '오늘도 새로운 시작입니다.\n당신의 가능성을 믿으세요.\n' > input/subtitles.txt

      - name: Create Shorts
        run: |
          python video_engine.py \
            --input input/sample.mp4 \
            --output output/shorts_final.mp4 \
            --duration 30 \
            --subtitles input/subtitles.txt

      - name: Upload Shorts Video
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video

          
      - name: Save MP4 to GitHub
        run: |
          mkdir -p docs/videos
          cp output/shorts_final.mp4 docs/videos/shorts_final.mp4
          git config user.name "Shorts AI Bot"
          git config user.email "actions@github.com"
          git add docs/videos/
          git diff --cached --quiet || git commit -m "Save generated Shorts video"
          git push

          path: output/shorts_final.mp4
          if-no-files-found: error
          retention-days: 7

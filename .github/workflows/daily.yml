
name: Daily Shorts AI

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '영상 주제 (영어)'
        required: false
        default: 'kitten'
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum
          pip install requests

      - name: Search YouTube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python engine.py

      - name: Download Wikimedia Video
        env:
          TOPIC: ${{ inputs.topic || 'kitten' }}
        run: |
          mkdir -p input output

          python - <<'PY'
          import os
          import re
          import html
          import json
          import random
          import requests
          import subprocess
          from pathlib import Path

          topic = os.environ.get("TOPIC", "kitten")
          api = "https://commons.wikimedia.org/w/api.php"

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "ShortsAIStudio/1.0 "
                  "(https://github.com/jinjinji189-cpu/shorts-ai-studio)"
              )
          })

          def clean(value):
              return html.unescape(
                  re.sub(r"<[^>]+>", "", value or "")
              ).strip()

          def getmeta(meta, key):
              return clean(
                  meta.get(key, {}).get("value", "")
              )

          print("Searching Wikimedia:", topic)

          params = {
              "action": "query",
              "generator": "search",
              "gsrsearch": topic + " filetype:video",
              "gsrnamespace": 6,
              "gsrlimit": 40,
              "prop": "imageinfo",
              "iiprop": "url|mime|size|extmetadata",
              "format": "json",
              "formatversion": 2
          }

          response = session.get(
              api, params=params, timeout=60
          )
          response.raise_for_status()

          data = response.json()

          if "error" in data:
              raise RuntimeError(str(data["error"]))

          pages = data.get("query", {}).get("pages", [])

          random.shuffle(pages)

          selected = None

          for page in pages:
              infos = page.get("imageinfo", [])

              if not infos:
                  continue

              info = infos[0]
              mime = info.get("mime", "")

              if mime not in [
                  "video/webm",
                  "video/mp4",
                  "video/ogg"
              ]:
                  continue

              if info.get("size", 0) > 150000000:
                  continue

              meta = info.get("extmetadata", {})
              license_name = getmeta(
                  meta, "LicenseShortName"
              )

              license_url = getmeta(
                  meta, "LicenseUrl"
              )

              license_lower = license_name.lower()

              allowed = (
                  license_lower == "public domain"
                  or license_lower.startswith("cc0")
                  or re.fullmatch(
                      r"cc by [0-9.]+",
                      license_lower
                  ) is not None
              )

              if not allowed:
                  continue

              if not info.get("url"):
                  continue

              artist = getmeta(meta, "Artist")

              if (
                  license_lower.startswith("cc by")
                  and (not artist or not license_url)
              ):
                  continue

              selected = (page, info, meta)
              break

          if selected is None:
              raise RuntimeError(
                  "No suitable licensed video found. "
                  "Try another topic such as cat, "
                  "bird, butterfly or waterfall."
              )

          page, info, meta = selected

          print("Selected:", page.get("title"))
          print("License:", getmeta(
              meta, "LicenseShortName"
          ))

          with session.get(
              info["url"],
              stream=True,
              timeout=(20, 120)
          ) as download:

              download.raise_for_status()

              with open("input/source_video", "wb") as out:
                  for chunk in download.iter_content(
                      chunk_size=1024 * 1024
                  ):
                      if chunk:
                          out.write(chunk)

          subprocess.run([
              "ffmpeg", "-y",
              "-i", "input/source_video",
              "-an",
              "-vf",
              "scale=1080:1920:force_original_aspect_ratio=decrease,"
              "pad=1080:1920:(ow-iw)/2:(oh-ih)/2,"
              "setsar=1",
              "-c:v", "libx264",
              "-preset", "fast",
              "-pix_fmt", "yuv420p",
              "input/sample.mp4"
          ], check=True)

          source = {
              "topic": topic,
              "title": page.get("title", ""),
              "creator": getmeta(meta, "Artist"),
              "license": getmeta(
                  meta, "LicenseShortName"
              ),
              "license_url": getmeta(
                  meta, "LicenseUrl"
              ),
              "source": info.get(
                  "descriptionurl", ""
              ),
              "provider": "Wikimedia Commons",
              "changes": (
                  "Vertical formatting, trimming, "
                  "looping and Korean captions"
              )
          }

          Path("output/source.json").write_text(
              json.dumps(
                  source,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          credits = (
              "Title: " + source["title"] + "\n"
              "Creator: " + source["creator"] + "\n"
              "License: " + source["license"] + "\n"
              "License URL: " + source["license_url"] + "\n"
              "Source: " + source["source"] + "\n"
              "Changes: " + source["changes"] + "\n"
          )

          Path("output/credits.txt").write_text(
              credits, encoding="utf-8"
          )

          if any(
              word in topic.lower()
              for word in ["cat", "kitten"]
          ):
              captions = [
                  "잠깐, 이 귀여운 순간을 보세요!",
                  "작은 생명이 건네는 따뜻한 위로.",
                  "바쁜 하루에도 미소는 필요합니다.",
                  "오늘의 행복을 선물합니다."
              ]
          else:
              captions = [
                  "잠시 멈춰 이 순간을 바라보세요.",
                  "세상에는 우리가 놓친 아름다움이 있습니다.",
                  "평범한 순간에도 특별함은 숨어 있습니다.",
                  "오늘도 당신의 하루가 빛나기를."
              ]

          times = [
              ("00:00:00,000", "00:00:07,000"),
              ("00:00:07,000", "00:00:14,000"),
              ("00:00:14,000", "00:00:22,000"),
              ("00:00:22,000", "00:00:30,000")
          ]

          subtitles = ""

          for i, (caption, timing) in enumerate(
              zip(captions, times), 1
          ):
              subtitles += (
                  f"{i}\n"
                  f"{timing[0]} --> {timing[1]}\n"
                  f"{caption}\n\n"
              )

          Path("input/subtitles.srt").write_text(
              subtitles, encoding="utf-8"
          )

          print("Video and captions ready")
          PY

      - name: Create Shorts
        run: |
          ffmpeg -y \
            -stream_loop -1 \
            -i input/sample.mp4 \
            -t 30 \
            -vf "subtitles=input/subtitles.srt:force_style='FontName=NanumGothic,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=35'" \
            -c:v libx264 \
            -preset fast \
            -crf 23 \
            -r 30 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/shorts_final.mp4

      - name: Add AI Voice and Music
        run: |
          pip install edge-tts

          python - <<'PY'
          import asyncio
          import edge_tts
          import re
          import math
          import wave
          import struct
          import subprocess
          from pathlib import Path

          voice = "ko-KR-SunHiNeural"

          text = Path("input/subtitles.srt").read_text(
              encoding="utf-8"
          )

          blocks = re.split(r"\n\s*\n", text.strip())

          captions = []
          starts = []

          def seconds(value):
              h, m, s = value.replace(",", ".").split(":")
              return float(h)*3600 + float(m)*60 + float(s)

          for block in blocks:
              lines = block.splitlines()

              if len(lines) >= 3:
                  start = lines[1].split(" --> ")[0]
                  starts.append(seconds(start))
                  captions.append(" ".join(lines[2:]))

          if not captions:
              raise RuntimeError("No captions found")

          async def create_voice():
              for i, caption in enumerate(captions):
                  tts = edge_tts.Communicate(
                      caption,
                      voice,
                      rate="-5%",
                      pitch="+0Hz"
                  )
                  await tts.save(
                      f"input/voice_{i}.mp3"
                  )

          asyncio.run(create_voice())

          # Create original soft piano-style music
          sample_rate = 22050
          duration = 30

          chords = [
              [261.63, 329.63, 392.00],
              [220.00, 261.63, 329.63],
              [174.61, 220.00, 261.63],
              [196.00, 246.94, 293.66]
          ]

          audio = bytearray()

          for n in range(sample_rate * duration):
              t = n / sample_rate
              chord = chords[int(t / 4) % 4]
              local = t % 4
              value = 0.0

              for j, freq in enumerate(chord):
                  age = local - j * 0.5

                  if age >= 0:
                      envelope = (
                          min(age / 0.04, 1)
                          * math.exp(-age * 0.9)
                      )

                      value += envelope * (
                          math.sin(2*math.pi*freq*age)
                          + 0.2*math.sin(
                              4*math.pi*freq*age
                          )
                      )

              fade = min(1, t/1.5, (30-t)/2)
              sample = int(value * 1800 * fade)
              sample = max(-32767, min(32767, sample))
              audio.extend(struct.pack("<h", sample))

          with wave.open("input/music.wav", "wb") as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(sample_rate)
              f.writeframes(audio)

          # Mix narration with background music
          cmd = [
              "ffmpeg", "-y",
              "-i", "output/shorts_final.mp4"
          ]

          for i in range(len(captions)):
              cmd += ["-i", f"input/voice_{i}.mp3"]

          cmd += ["-i", "input/music.wav"]

          filters = []
          labels = []

          for i, start in enumerate(starts):
              delay = int(start * 1000)
              label = f"v{i}"

              filters.append(
                  f"[{i+1}:a]"
                  f"adelay={delay}:all=1,"
                  f"volume=1.0[{label}]"
              )

              labels.append(f"[{label}]")

          music_index = len(captions) + 1

          filters.append(
              f"[{music_index}:a]"
              "volume=0.25[music]"
          )

          labels.append("[music]")

          filters.append(
              "".join(labels)
              + f"amix=inputs={len(labels)}:"
              "duration=longest:normalize=0,"
              "alimiter=limit=0.95[audio]"
          )

          cmd += [
              "-filter_complex", ";".join(filters),
              "-map", "0:v:0",
              "-map", "[audio]",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-t", "30",
              "-movflags", "+faststart",
              "output/shorts_with_audio.mp4"
          ]

          subprocess.run(cmd, check=True)

          Path("output/shorts_with_audio.mp4").replace(
              "output/shorts_final.mp4"
          )

          print("AI voice and music added successfully")
          PY

      - name: Verify Video
        run: |
          test -s output/shorts_final.mp4

          ffprobe -v error \
            -show_entries format=duration,size \
            -of json \
            output/shorts_final.mp4

      - name: Upload Shorts Video
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: |
            output/shorts_final.mp4
            output/source.json
            output/credits.txt
          if-no-files-found: error
          retention-days: 7

      - name: Save Results
        run: |
          mkdir -p docs/videos

          cp output/shorts_final.mp4 \
            docs/videos/shorts_final.mp4

          cp output/source.json \
            docs/videos/source.json

          cp output/credits.txt \
            docs/videos/credits.txt

          git config user.name "Shorts AI Bot"
          git config user.email "actions@github.com"

          git add docs/

          git diff --cached --quiet || \
            git commit -m "Update Wikimedia Shorts video"

          git push
